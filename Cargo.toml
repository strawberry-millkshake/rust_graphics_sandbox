[package]
name = "rust_graphics_sandbox"
version = "0.1.0"
edition = "2024"

[dependencies]
glfw = "0.60.0"
glam = "0.27"
bytemuck = { version = "1.15", features = ["derive"] }
imgui = "0.12.0"
nanorand = "0.8.0"
pollster = "0.4.0"
smallvec = "1.15.1"
wgpu = "27.0.1"
rand = "0.9.2"

[dependencies.image]
version = "0.24"
default-features = false
features = ["png", "jpeg"]